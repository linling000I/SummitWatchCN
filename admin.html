<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SummitWatchCN Admin</title>
<style>
:root{--bg:#0f1419;--card:#1a2129;--line:#2a3440;--fg:#e6edf3;--mut:#8b98a5;--acc:#4493f8;--bad:#f85149;--ok:#3fb950;--warn:#d29922}
*{box-sizing:border-box}body{margin:0;font-family:'Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:18px;margin:0}main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,button{background:#0d1117;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px}
input{min-width:140px}button{cursor:pointer;background:#21262d}button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}button.danger{color:var(--bad);border-color:#5f2326}
table{width:100%;border-collapse:collapse}th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:normal;font-size:12px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px}.tag.bad{background:#3d1f23;color:var(--bad)}.tag.warn{background:#3a2f16;color:var(--warn)}.tag.ok{background:#123318;color:var(--ok)}
.mut{color:var(--mut);font-size:12px}.right{margin-left:auto}#status{font-size:13px}code{background:#0d1117;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header><h1>SummitWatchCN 网络黑名单管理台</h1><span id="status">加载中…</span>
<span class="right row"><button id="btnSteam">用 Steam 登录识别身份</button><button onclick="load()">刷新</button></span></header>
<main>
<div class="card"><b>主管理员认证（GitHub）</b><div class="mut">粘贴一个有本仓库 Contents 读写权限的 GitHub Token（fine-grained PAT），仅存浏览器 localStorage，用于直接提交 blacklist.json。</div>
<div class="row" style="margin-top:8px"><input id="token" type="password" placeholder="github_pat_xxx" style="flex:1"><button class="primary" onclick="loginGitHub()">登录并验证</button></div></div>
<div class="card"><div class="row"><b>封禁条目（entries，SteamID 为主）</b><span class="right row"><input id="nId" placeholder="SteamID64" style="width:170px"><input id="nName" placeholder="名称" style="width:110px"><input id="nReason" placeholder="原因" style="width:160px"><button class="primary" onclick="addEntry()">+ 添加封禁</button></span></div>
<table><thead><tr><th>SteamID</th><th>名称</th><th>原因</th><th>加入日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="eb"></tbody></table></div>
<div class="card"><b>限时赦免观察区（pardons）</b><div class="mut">观察期内暂不自动踢出，再犯只计数；到期自动失效。</div>
<table><thead><tr><th>SteamID</th><th>到期日</th><th>再犯次数</th><th>操作</th></tr></thead><tbody id="pb"></tbody></table></div>
<div class="card"><b>管理员列表（admins SteamID64）</b><div class="row" id="ab" style="margin-top:8px"></div></div>
</main>
<script>
const REPO="linling000I/SummitWatchCN",PATH="blacklist.json",RAW="https://raw.githubusercontent.com/"+REPO+"/main/"+PATH;
let data={version:1,admins:[],entries:[],pardons:[]},sha=null,ghUser=null,steamId=new URLSearchParams(location.hash.slice(1)).get("steamid")||"";
function getToken(){return localStorage.getItem("swcn_pat")||""}
async function api(u,o={}){const t=getToken();o.headers=Object.assign({Authorization:t?"token "+t:"","Accept":"application/vnd.github+json"},o.headers||{});const r=await fetch(u,o);if(!r.ok)throw new Error(u+" -> "+r.status);return r}
async function loginGitHub(){const t=document.getElementById("token").value.trim();if(!t)return alert("请粘贴 Token");localStorage.setItem("swcn_pat",t);try{ghUser=(await (await fetch("https://api.github.com/user",{headers:{Authorization:"token "+t}})).json()).login;setStatus();await saveData()}catch(e){alert("登录失败:"+e.message)}}
function setStatus(){let s=ghUser?"已认证 GitHub: @"+ghUser:"未认证（只读）";if(steamId)s+=" · SteamID: "+steamId;document.getElementById("status").textContent=s}
async function load(){try{data=await(await fetch(RAW+"?t="+Date.now())).json();sha=null;render()}catch(e){document.getElementById("status").textContent="加载失败"}}
function esc(s){return(s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function render(){setStatus();const eb=document.getElementById("eb");eb.innerHTML="";data.entries.forEach((e,i)=>{const pd=(data.pardons||[]).find(p=>p.id===e.id);const tr=document.createElement("tr");tr.innerHTML=`<td><code>${esc(e.id)}</code></td><td>${esc(e.name||"")}</td><td>${esc(e.reason||"")}</td><td>${esc(e.added||"")}</td><td>${pd?'<span class="tag warn">赦免观察中</span>':'<span class="tag bad">已封禁</span>'}</td><td><button onclick="pardon(${i})">限时赦免</button> <button class="danger" onclick="delEntry(${i})">删除</button></td>`;eb.appendChild(tr)});const pb=document.getElementById("pb");pb.innerHTML="";(data.pardons||[]).forEach((p,i)=>{const tr=document.createElement("tr");tr.innerHTML=`<td><code>${esc(p.id)}</code></td><td><input type="date" value="${esc(p.until||"")}" id="pd${i}"></td><td>${p.strikes||0}</td><td><button onclick="updatePardon(${i})">保存</button> <button class="danger" onclick="delPardon(${i})">移除赦免</button></td>`;pb.appendChild(tr)});const ab=document.getElementById("ab");ab.innerHTML="";data.admins.forEach(a=>{const s=document.createElement("span");s.className="tag ok";s.textContent=a;ab.appendChild(s)})}
function addEntry(){const id=document.getElementById("nId").value.trim();if(!id)return alert("SteamID 必填");data.entries.push({id,name:document.getElementById("nName").value.trim(),reason:document.getElementById("nReason").value.trim(),added:new Date().toISOString().slice(0,10)});document.getElementById("nId").value="";document.getElementById("nName").value="";document.getElementById("nReason").value="";saveData()}
function delEntry(i){if(!confirm("删除该条目？"))return;data.entries.splice(i,1);saveData()}
function pardon(i){const d=prompt("限时赦免天数：","7");if(d===null)return;const until=new Date(Date.now()+parseInt(d)*86400000).toISOString().slice(0,10);const e=data.entries[i];if(!(data.pardons||[]).some(p=>p.id===e.id))data.pardons.push({id:e.id,until,strikes:0});saveData()}
function updatePardon(i){data.pardons[i].until=document.getElementById("pd"+i).value;saveData()}
function delPardon(i){if(!confirm("结束赦免观察？"))return;data.pardons.splice(i,1);saveData()}
async function saveData(){if(!getToken())return alert("请先登录 GitHub Token");try{if(!sha){sha=(await (await api("https://api.github.com/repos/"+REPO+"/contents/"+PATH)).json()).sha}const body=JSON.stringify(data,null,2);await api("https://api.github.com/repos/"+REPO+"/contents/"+PATH,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"update blacklist",content:btoa(unescape(encodeURIComponent(body))),sha})});sha=null;render();document.getElementById("status").textContent="已提交到仓库 ✓"}catch(e){alert("提交失败:"+e.message)}}
document.getElementById("btnSteam").onclick=()=>{const realm=location.origin+location.pathname;window.location="https://steamcommunity.com/openid/login?"+new URLSearchParams({"openid.ns":"http://specs.openid.net/auth/2.0","openid.mode":"checkid_setup","openid.return_to":realm,"openid.realm":realm,"openid.identity":"http://specs.openid.net/auth/2.0/identifier_select","openid.claimed_id":"http://specs.openid.net/auth/2.0/identifier_select"})};
(function(){const m=location.href.match(/steamcommunity\.com\/openid\/id\/(\d+)/);if(m){history.replaceState(null,"",location.pathname+"#steamid="+m[1]);steamId=m[1]}})();
load();
</script>
</body>
</html>
